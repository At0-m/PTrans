services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ptrans
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ptrans"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    image: postgres:16-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/ptrans?sslmode=disable
    volumes:
      - ./migrations:/migrations:ro
    entrypoint: ["/bin/sh", "-c"]
    command: |
      for migration in /migrations/*.sql; do
        echo "applying $$migration"
        psql "$$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$$migration"
      done

  app:
    build: .
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      LISTEN_ADDR: :8080
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/ptrans?sslmode=disable
      RATE_LIMIT_MUTATIONS_PER_MINUTE: 20
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/readyz"]
      interval: 10s
      timeout: 3s
      retries: 5

  worker:
    build: .
    command: ["/usr/local/bin/ptrans-worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/ptrans?sslmode=disable
      WORKER_BATCH_SIZE: 10
      WORKER_POLL_INTERVAL: 2s
      WORKER_LOCK_FOR: 30s
      WEBHOOK_HTTP_TIMEOUT: 5s
      WEBHOOK_MAX_ATTEMPTS: 5
      WEBHOOK_INITIAL_BACKOFF: 2s
      WEBHOOK_MAX_BACKOFF: 1m

  mock-webhook:
    build: .
    command: ["/usr/local/bin/ptrans-mock-webhook"]
    environment:
      MOCK_WEBHOOK_ADDR: :8090
      MOCK_WEBHOOK_MODE: ok
    ports:
      - "8090:8090"

volumes:
  postgres_data:
